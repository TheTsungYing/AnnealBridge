[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "annealbridge"
version = "0.3.0"
description = "Optimization middleware for AI agents: deterministic BQM/CQM compilation, solving, re-validation and ranking of combinatorial optimization problems, exposed over MCP and a CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TsungYing" }]
requires-python = ">=3.11"
keywords = [
    "optimization",
    "combinatorial-optimization",
    "qubo",
    "bqm",
    "cqm",
    "quantum-annealing",
    "simulated-annealing",
    "d-wave",
    "fujitsu-digital-annealer",
    "mcp",
    "model-context-protocol",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The lower bounds below are the lowest versions the default test suite has been
# run against (the CI "lowest-deps" job keeps them honest); older releases either
# lack wheels, emit warnings on import, or break at runtime.
dependencies = [
    # Before 2.10 the `model_type` field trips pydantic's protected-namespace warning.
    "pydantic>=2.10",
    # 2.7 is the first release exposing `NoDecode`, used by config/settings.py.
    "pydantic-settings>=2.7",
    # 0.12.19 is the first release importing cleanly under numpy 2.
    "dimod>=0.12.19",
    # numpy 1.x on Windows defaults to int32 where int64 is relied upon.
    "numpy>=2.0",
    # 1.3 is the first release supporting numpy 2.
    "dwave-samplers>=1.3",
    # 0.26 no longer depends on click; older typer breaks under newer click.
    "typer>=0.26",
]

[project.optional-dependencies]
# 2.1 is the lowest release the MCP tests pass against (2.0 lacks the stdio
# client API they use).
mcp = ["mcp>=2.1,<3"]
# 1.26 is the first release that resolves alongside dimod 0.12 and pulls a
# dwave-cloud-client (>=0.13) that neither imports `requests` eagerly nor needs
# `pkg_resources`.
dwave = ["dwave-system>=1.26"]
# GPU acceleration for the simulated_bifurcation backend (ANNEALBRIDGE_SB_DEVICE=cuda).
# Deliberately not part of `all`: torch is hundreds of MB, and on Windows the
# PyPI wheel is the CPU-only build -- the CUDA build comes from PyTorch's own
# index (see docs/backends.md), which a pip extra cannot express.
gpu = ["torch>=2.0"]
all = ["mcp>=2.1,<3", "dwave-system>=1.26"]
# "pytest-anyio" does not exist as a real distribution (PyPI only has an empty
# 0.0.0 placeholder); anyio ships its own pytest plugin, so depend on anyio.
# ruff is capped to one minor series: a new minor can change rule behaviour and
# turn CI red on its own.
dev = ["pytest>=8.0", "anyio>=4", "mcp[cli]>=2.1,<3", "ruff>=0.16.7,<0.17"]

[project.urls]
Homepage = "https://github.com/TheTsungYing/AnnealBridge"
Repository = "https://github.com/TheTsungYing/AnnealBridge"
Documentation = "https://github.com/TheTsungYing/AnnealBridge/tree/main/docs"
Issues = "https://github.com/TheTsungYing/AnnealBridge/issues"
Changelog = "https://github.com/TheTsungYing/AnnealBridge/blob/main/CHANGELOG.md"

[project.scripts]
annealbridge = "annealbridge.interfaces.cli.main:main"
annealbridge-mcp = "annealbridge.interfaces.mcp_entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

# The example problems the CLI's `example` command prints and the MCP server
# serves as resources. They are byte-for-byte copies of the repository's
# examples/ (a test holds the two equal) and must reach the wheel, which the
# repository directory never does.
[tool.setuptools.package-data]
"annealbridge.interfaces" = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselect the opt-in live remote tests by default so a plain `pytest` never
# consumes vendor quota. Run them explicitly with `pytest -m remote`; each live
# test skips unless its own vendor credential is set.
addopts = '-m "not remote"'
markers = [
    "remote: live remote tests (opt-in; consume vendor quota; each needs its vendor credential: DWAVE_API_TOKEN or FUJITSU_DA_API_KEY)",
]
# The default suite tolerates neither skips/xfails nor warning noise: an xfail
# that starts passing is a failure, and every warning is raised as an error so
# it is dealt with immediately instead of accumulating. The suite is warning
# free today, so no ignore entry is needed.
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "."]

[tool.ruff.lint]
select = ["F", "I"]
