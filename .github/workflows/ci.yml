# CI — spec §29
#
# An ordinary push / PR runs: a ruff lint (F and I rules only, Linux only),
# then unit, scenarios, architecture, mcp, remote_mock on Linux and Windows
# with Python 3.11 and 3.12.
# The lowest-deps job reruns the same tests with every direct dependency
# pinned to the lower bound declared in pyproject.toml.
# The package job additionally builds the sdist and the wheel and exercises the
# installed distribution — not the checkout — in clean virtual environments on
# Linux and Windows (2026-09-11 install verification, gap 4).
# The remote_live tests are deselected by default through the pytest addopts
# (-m "not remote"), so this workflow consumes no vendor quota and needs
# neither DWAVE_API_TOKEN nor FUJITSU_DA_API_KEY.
#
# This file deliberately contains no printenv / env dump / echo secrets /
# debug environment step.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch (or PR) makes the run in flight obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package with all extras
        id: install
        run: pip install -e ".[all,dev]"

      # Lint only: F (pyflakes) and I (import sorting); no formatter.
      # Linux only: the result does not depend on the platform or the Python
      # version, and running it once avoids duplicate annotations on the PR.
      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: ruff check .

      # No -m here: the pyproject addopts = -m "not remote" applies, which
      # covers unit / scenarios / architecture / mcp / remote_mock.
      # Runs even if lint fails: lint never hides test results; job still fails.
      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest

  # Guards the lower bounds declared in pyproject.toml: every direct
  # dependency is installed at its declared minimum version, while indirect
  # dependencies are resolved as usual (uv --resolution lowest-direct).
  #
  # Coverage limit: under [all,dev], mcp raises pydantic / anyio to its own
  # higher lower bounds, so the declared floors of those two are not what this
  # job installs (the core-only pydantic floor was verified locally).
  lowest-deps:
    name: Lowest direct dependencies (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Installed with pip rather than through a setup action, so the
      # workflow takes on no further third-party action.
      - name: Install uv
        run: python -m pip install uv

      # Not editable. --compile-bytecode is required: uv does not precompile
      # by default, so invalid escape sequences in the source of old
      # dependency releases would raise SyntaxWarning at import time, and the
      # pyproject filterwarnings = ["error"] turns that into a collection
      # error. pip precompiles on install, so the other jobs are unaffected.
      - name: Install package with all extras at the lowest direct versions
        run: uv pip install --system --resolution lowest-direct --compile-bytecode ".[all,dev]"

      # Prints the versions actually selected, for the log.
      - name: Show the resolved versions
        run: uv pip freeze --system

      - name: Run tests
        run: pytest

  minimal-install:
    name: Minimal install (no extras)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Deliberately no extras: proves the package still works without
      # mcp / dwave-system installed.
      - name: Install package without extras
        run: pip install .

      - name: Solver registry works without optional dependencies
        run: python -c "from annealbridge.solvers import SolverRegistry; r = SolverRegistry.default(); print(r.names())"

      - name: CLI works without optional dependencies
        run: annealbridge export-schema

      # Phase 3a smoke (spec §30 step 10): validate / recommend are one-line
      # delegations to the service and must work without any extra installed;
      # recommend lists all eight backends and never touches the network.
      - name: CLI validate and recommend work without optional dependencies
        run: |
          annealbridge validate examples/knapsack.json
          annealbridge recommend examples/knapsack.json

      # The shipped examples are package data of annealbridge.interfaces, not
      # of the mcp subpackage, so the CLI can print them without the extra.
      - name: CLI example works without optional dependencies
        run: annealbridge example knapsack

      # 2026-09-11 install verification (gap 3): the core install ships the
      # annealbridge-mcp script but not the mcp dependency. It must report
      # the missing extra on stderr with exit code 2 — never a traceback,
      # and nothing on stdout.
      - name: MCP entry point reports the missing extra instead of a traceback
        run: |
          set +e
          annealbridge-mcp --help > out.txt 2> err.txt
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'annealbridge\[mcp\]' err.txt
          ! grep -q Traceback err.txt
          test ! -s out.txt

  # 2026-09-11 install verification (gap 4): the two jobs above only ever test
  # the checkout. This one tests the artefact a user actually receives — the
  # built wheel, installed into a clean environment, driven through its real
  # console scripts from a directory outside the checkout.
  package:
    name: Built distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 only: the test job already covers 3.11 / 3.12 on Linux
        # and Windows, what is new here is the packaging itself.
        os: [ubuntu-latest, windows-latest]
    # One shell for both runners — the Windows runner ships Git Bash, so the
    # steps below do not need a second, PowerShell-flavoured copy.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # `python -m build` builds the sdist first and then builds the wheel from
      # that unpacked sdist. The wheel installed below is therefore exactly what
      # a rebuild from the source distribution produces: a file missing from the
      # sdist cannot survive into the wheel unnoticed.
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel into a clean core-only environment
        run: |
          # $RUNNER_TEMP is outside the checkout on both runners. Git Bash
          # accepts the native Windows value as-is, so it needs no conversion.
          python -m venv "$RUNNER_TEMP/core"
          if [ -x "$RUNNER_TEMP/core/bin/python" ]; then
            PY="$RUNNER_TEMP/core/bin/python"
          else
            PY="$RUNNER_TEMP/core/Scripts/python.exe"
          fi
          "$PY" -m pip install dist/*.whl
          "$PY" -m pip check
          # The probe copies the example problems to a temporary directory and
          # runs the installed console scripts from there, so nothing in the
          # checkout can satisfy an import or a data file by accident. No
          # extras installed: annealbridge-mcp --help must exit 2.
          "$PY" scripts/check_install.py --examples examples

      - name: Install the wheel with the [mcp] extra into a second clean environment
        run: |
          python -m venv "$RUNNER_TEMP/mcp"
          if [ -x "$RUNNER_TEMP/mcp/bin/python" ]; then
            PY="$RUNNER_TEMP/mcp/bin/python"
          else
            PY="$RUNNER_TEMP/mcp/Scripts/python.exe"
          fi
          # pip accepts a local wheel path carrying an extra suffix.
          WHEEL=$(ls dist/*.whl)
          "$PY" -m pip install "$WHEEL[mcp]"
          "$PY" -m pip check
          # --mcp adds the stdio handshake and a real tool call on top of the
          # core checks.
          "$PY" scripts/check_install.py --examples examples --mcp
