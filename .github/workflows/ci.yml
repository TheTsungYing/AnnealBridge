# CI — spec §29
#
# An ordinary push / PR runs: unit, scenarios, architecture, mcp, remote_mock.
# The remote_live tests are deselected by default through the pytest addopts
# (-m "not remote"), so this workflow consumes no vendor quota and needs
# neither DWAVE_API_TOKEN nor FUJITSU_DA_API_KEY.
#
# This file deliberately contains no printenv / env dump / echo secrets /
# debug environment step.

name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with all extras
        run: pip install -e ".[all,dev]"

      # No -m here: the pyproject addopts = -m "not remote" applies, which
      # covers unit / scenarios / architecture / mcp / remote_mock.
      - name: Run tests
        run: pytest

  minimal-install:
    name: Minimal install (no extras)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately no extras: proves the package still works without
      # mcp / dwave-system installed.
      - name: Install package without extras
        run: pip install .

      - name: Solver registry works without optional dependencies
        run: python -c "from annealbridge.solvers import SolverRegistry; r = SolverRegistry.default(); print(r.names())"

      - name: CLI works without optional dependencies
        run: annealbridge export-schema

      # Phase 3a smoke (spec §30 step 10): validate / recommend are one-line
      # delegations to the service and must work without any extra installed;
      # recommend lists all six backends and never touches the network.
      - name: CLI validate and recommend work without optional dependencies
        run: |
          annealbridge validate examples/knapsack.json
          annealbridge recommend examples/knapsack.json
