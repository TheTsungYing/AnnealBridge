# Release — publishes the built distribution to PyPI.
#
# Trigger: a pushed tag `vX.Y.Z` that matches the version in pyproject.toml.
# Authentication is PyPI Trusted Publishing (OpenID Connect): the `pypi`
# GitHub environment is registered on PyPI as the trusted publisher of the
# `annealbridge` project, so no API token is stored anywhere. Running the
# workflow by hand (workflow_dispatch) publishes to TestPyPI through the
# `testpypi` environment instead — a rehearsal that spends no real version
# number, since PyPI accepts each version exactly once.
#
# The build is the same `python -m build` the CI package job exercises. The
# publish jobs never check out the repository; they only touch the artefact.
# This file deliberately contains no printenv / env dump / debug step.
#
# Nothing is published unless the whole CI workflow passes on the very commit
# being released: the `ci` job below calls ci.yml, and both publish jobs wait
# for it. A release tag must also point at a commit that is on main.
#
# Supply chain: every action is pinned to a full commit SHA (the release it
# belongs to is in a trailing comment), the build tools are pinned to exact
# versions and installed without a cache, and the one downloaded executable
# (mcp-publisher) is pinned to a release and verified by checksum before it
# runs. To upgrade any of them, change the pin and its comment together.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Default for every job that does not ask for more. The publish jobs set
# their own `permissions:` block, which replaces this one entirely.
permissions:
  contents: read

jobs:
  # The same tests, lowest-dependency run, minimal install and built
  # distribution checks an ordinary push gets, run again on the commit being
  # released. A tag can be pushed for a commit whose CI run failed, was
  # cancelled or never happened; PyPI accepts each version exactly once, so
  # the check has to sit in front of the upload rather than rely on memory.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      # Full history: the ancestry check below needs it, and a shallow clone
      # could report a commit as unrelated to main when it is not.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A release is cut from main. A tag on a commit that never reached main
      # (a local branch, an abandoned experiment) is refused before anything
      # is built.
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi

      # No pip cache: a release build must not reuse files a previous run left
      # behind.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml would publish a version
      # nobody meant to release; refuse it before building anything.
      # server.json carries the same version twice for the MCP Registry, and a
      # stale copy there would leave the registry pointing at the wrong
      # release. All three are checked here, before anything irreversible.
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
          python - "$version" <<'CHECK'
          import json, sys

          expected = sys.argv[1]
          server = json.load(open("server.json", encoding="utf-8"))
          found = {"server.json version": server["version"]}
          for package in server["packages"]:
              found[f"package {package['identifier']}"] = package["version"]
          wrong = {where: got for where, got in found.items() if got != expected}
          if wrong:
              for where, got in wrong.items():
                  print(f"{where} is {got}, expected {expected}", file=sys.stderr)
              sys.exit(1)
          CHECK

      # Exact versions, so the tools that produce a published artefact change
      # only when this line does.
      - name: Install build tools
        run: python -m pip install build==1.6.1 twine==7.0.0

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the distribution metadata
        run: python -m twine check dist/*

      - name: Upload the distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/annealbridge/
    permissions:
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build, ci]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/annealbridge/
    permissions:
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-registry:
    name: Publish to MCP Registry
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      # OIDC: the registry trusts this repository's token to publish under the
      # io.github.TheTsungYing namespace, so no credential is stored anywhere.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The registry proves ownership of a PyPI package by reading the
      # `mcp-name:` line out of the description PyPI renders from README.md,
      # so the release must be visible there first. PyPI's JSON API lags the
      # upload by a few seconds, so poll for the exact version rather than
      # sleeping for a guessed interval. Failing here leaves PyPI published
      # and the registry one version behind, which `mcp-publisher publish`
      # fixes by hand; it never publishes a version that is not on PyPI.
      - name: Wait for the release to appear on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          marker="mcp-name: io.github.TheTsungYing/annealbridge"
          for attempt in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/annealbridge/$version/json" | grep -qF "$marker"; then
              echo "annealbridge $version is on PyPI and carries the ownership marker"
              exit 0
            fi
            echo "attempt $attempt: not visible yet"
            sleep 10
          done
          echo "annealbridge $version never appeared on PyPI with the marker" >&2
          exit 1

      # This job holds an OIDC token that can publish under this repository's
      # registry namespace, so the binary it runs is pinned to one release and
      # checked against that release's checksum before it is unpacked; a
      # mismatch stops the job. Both values come from
      # https://github.com/modelcontextprotocol/registry/releases — the
      # checksum is the mcp-publisher_linux_amd64.tar.gz line of that
      # release's registry_<version>_checksums.txt. Change them together.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
          MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
