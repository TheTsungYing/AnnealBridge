# Remote live tests — spec §29
#
# Notes:
#   * The only trigger is workflow_dispatch (manual). There is deliberately
#     NO push / pull_request / schedule trigger, because this workflow really
#     connects to D-Wave Leap / Fujitsu DA and consumes quota.
#   * DWAVE_API_TOKEN and FUJITSU_DA_API_KEY come from repository secrets and
#     are injected into the single pytest step below only (not at job or
#     workflow level), keeping the secrets' exposure surface minimal.
#   * A secret that has not been created (FUJITSU_DA_API_KEY without a Fujitsu
#     account, say) is injected by GitHub as an empty string;
#     _require_live_opt_in in tests/remote_live/conftest.py tests for
#     truthiness, so an empty string counts as unset and the test skips. The
#     backend behaves the same way
#     (test_fujitsu_da_mock.py::TestIsAvailable::test_empty_key_counts_as_missing),
#     so the matching live test only skips, it never fails.
#   * A pull request from a fork cannot read this repository's secrets, and
#     workflow_dispatch can only be started manually by someone with
#     permission on this repository, so a fork cannot launch this workflow.
#   * This file deliberately contains no printenv / env dump / echo secrets /
#     debug environment step.

name: Remote Live Tests

on: workflow_dispatch

jobs:
  remote-live:
    name: Remote live tests (manual, consumes vendor quota)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with all extras
        run: pip install -e ".[all,dev]"

      # -m remote overrides the pyproject addopts -m "not remote" so the
      # remote_live tests actually run. Credentials are supplied to this
      # step only.
      - name: Run remote live tests
        run: pytest -m remote tests/remote_live -v
        env:
          DWAVE_API_TOKEN: ${{ secrets.DWAVE_API_TOKEN }}
          FUJITSU_DA_API_KEY: ${{ secrets.FUJITSU_DA_API_KEY }}
